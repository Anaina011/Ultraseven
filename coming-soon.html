<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        .hero {
            background: url("./img/kyle-loftus-Ve7iqUNkGsA-unsplash.jpg") center/cover no-repeat;
            height: 100vh;
            position: relative;
        }


        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .content-box {
            max-width: 600px;
            color: #fff;
            padding: 40px 30px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .contact-info a {
            color: #ff7f50;
            text-decoration: none;
        }

        .social-icons {
            margin-top: 20px;
        }

        .social-icons a {
            color: white;
            margin: 0 10px;
            font-size: 1.4rem;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #ff7f50;
        }




        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .content-box {
                padding: 30px 20px;
            }

            .logo {
                width: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="hero">
        <div class="overlay">
            <div class="content-box">
                <a href="index.html"><img src="img/u7logo_1.png" alt="Logo" class="logo" /></a>
                <h1>Launching soon!</h1>
                <p>
                    Exciting news! Our courses are launching soon. Until then, contact us via email, phone, or WhatsApp
                    for assistance. Stay tuned for an enhanced learning experience!
                </p>
                </p>

                <div class="contact-info">
                    <p><strong>For any inquiries please mail us</strong><br>
                        <a href="mailto:Connect@ultraseven.in">Connect@ultraseven.in</a>
                    </p>
                    <p><strong>Give us a call!</strong><br>
                        <a href="tel:91 80890 66879">91 80890 66879</a>
                    </p>
                </div>
                <!-- 
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div> -->
            </div>
        </div>
    </div>
</body>

</html>
